# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile built the C# solution with `dotnet build --nologo --verbosity
# quiet`. scripts/dotnet_build.py runs that exact command; the explicit
# processor triggers it on any source or project change. The projects target
# net8.0; the runner's dotnet-sdk-10.0 builds them via roll-forward.
[processor.explicit.dotnet]
command = "scripts/dotnet_build.py"
input_globs = ["src/**/*.cs", "src/**/*.csproj", "*.sln"]
output_dirs = ["src/Hello/bin", "src/DesignPatterns/bin", "src/MultiEntryPoint/bin", "src/LibraryManagementSystem/bin"]

# The .NET SDK builds the solution (Ubuntu ships dotnet-sdk-10.0, which builds
# the net8.0 projects).
[dependencies]
system = [
    "dotnet-sdk-10.0",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
